# fm-fedora — Noctalia shell configuration
# Generated by install/core/03-noctalia-env.sh
# Validate with: noctalia config validate ~/.config/noctalia/config.toml
# Reference: https://docs.noctalia.dev/noctalia/
#
# Minimal on purpose: one full-width square top bar, a static wallpaper, no
# dock. Monochrome only — palette: palettes/Monochrome.json (vendored copy of
# the community palette, pinned so no network fetch is needed).
# GUI changes land in ~/.local/state/noctalia/settings.toml and win over this
# file; keep the two in sync or edit only here.

# ==============================================================================
# Theme — pinned monochrome palette
# ==============================================================================
[theme]
mode = "dark"
source = "custom"
custom_palette = "Monochrome"

# ==============================================================================
# Wallpaper — static, no rotation
# ==============================================================================
[wallpaper]
enabled = true
fill_mode = "crop"
# Browse folder for the picker; the wallpaper itself is pinned below.
directory = "~/Pictures/wallpapers"

# Initial wallpaper on every output. Picking one in the UI rewrites this key in
# settings.toml, which loads after this file.
[wallpaper.default]
path = "~/Pictures/wallpapers/dw.jpg"

# ==============================================================================
# Dock — explicitly off
# ==============================================================================
[dock]
enabled = false

# ==============================================================================
# Bar — full width, square, no blur, no capsules
# ==============================================================================
[bar]
order = ["default"]

[bar.default]
position = "top"
enabled = true
reserve_space = true

background_opacity = 1.0
# No blur behind the bar: the wallpaper stays crisp under it.
compositor_blur = false
border_width = 0.0
shadow = false
capsule = false
hover_highlight = false

# Square corners, flush to both screen edges.
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false
margin_ends = 0
margin_edge = 0
padding = 10
# Even gap between widgets inside a lane. The left lane has one widget and the
# center lane one, so this effectively only widens the right-side icons.
widget_spacing = 10

# Left: workspace numbers only — no launcher/search.
# Right: status glyphs, then control center. Volume/brightness/notifications
# live in the control center now, not on the bar.
start = ["workspaces"]
center = ["clock"]
end = ["bluetooth", "network", "battery", "control-center"]

# ==============================================================================
# Widgets
# ==============================================================================
# Bare workspace numbers separated by a pipe, no pill backgrounds.
[widget.workspaces]
style = "minimal"
show_labels = true
label_source = "id"
separator = "|"
separator_color = "on_surface_variant"
change_color_on_hover = false
focused_color = "on_surface"
occupied_color = "on_surface_variant"
empty_color = "outline_variant"

# Center: time with day and date on one line, full date on hover.
[widget.clock]
format = "{:%a %d %b  %H:%M}"
tooltip_format = "{:%A, %B %d, %Y}"

# Clock is display-only: no panel on click, no scroll actions. Hover tooltip
# still works (bindings do not disable it).
[widget.clock.actions]
left = "none"
right = "none"
middle = "none"
back = "none"
forward = "none"
scroll_up = "none"
scroll_down = "none"

# Right: battery — glyph swaps to the charging/plugged icon on its own, label is
# the percentage. Display only, no click or scroll actions.
[widget.battery]
display_mode = "glyph"
show_label = true
label_content = "percent"

[widget.battery.actions]
left = "none"
right = "none"
middle = "none"
back = "none"
forward = "none"
scroll_up = "none"
scroll_down = "none"

# Bluetooth — icon only. Built-in actions kept: left opens the control-center
# Bluetooth tab (adapter power, paired/connected devices, pairing), right
# toggles the adapter.
[widget.bluetooth]
show_label = false

# Network — icon only. Built-in actions kept: left opens the control-center
# Network tab (Wi-Fi toggle, current SSID, known networks), right toggles the
# radio.
[widget.network]
show_label = false

# Control center — Tabler "adjustments-alt": two slider rows with the knobs at
# opposite ends.
[widget.control-center]
glyph = "adjustments-alt"

# ==============================================================================
# Shell panels
# ==============================================================================
[shell.panel]
control_center_placement = "attached"
control_center_position = "auto"
# Anchor the panel under the widget that was clicked instead of the bar center.
open_near_click_control_center = true
