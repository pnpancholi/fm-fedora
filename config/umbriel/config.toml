# fm-fedora — Umbriel configuration
# Generated by install/core/02-umbriel.sh
# Validate with: umbriel config validate -c ~/.config/umbriel/config.toml
# Reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Includes
# ==============================================================================
# Optional: bundled animation preset for the workspace reveal transition. A
# missing file is ignored, and Umbriel falls back to the native slide.
[include.optional]
files = ["/usr/share/umbriel/effects/animation/workspace_wipe/effect.toml"]

# ==============================================================================
# General
# ==============================================================================
[general]
mod_key = "Super"
# Noctalia owns the bar, wallpaper, panels and notifications.
autostart = ["noctalia"]

# Variables for Umbriel and everything it starts. Umbriel publishes these to the
# systemd user manager; it owns XDG_CURRENT_DESKTOP, so it is not set here.
[environment]
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "qt5ct"
SDL_VIDEODRIVER = "wayland"
CLUTTER_BACKEND = "wayland"
ELECTRON_OZONE_PLATFORM_HINT = "auto"

# ==============================================================================
# Input
# ==============================================================================
[input.keyboard]
layout = "us"
options = "caps:escape"
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true

[input.touchpad]
tap = true
tap_and_drag = true
drag_lock = "sticky"
natural_scroll = true
disable_while_typing = true

# ==============================================================================
# Appearance — Tokyo Night
# ==============================================================================
[colors]
background = "#1e1e1eff"
text_primary = "#ffffffff"
text_muted = "#8a8a92ff"
accent_primary = "#7aa2f7ff"
accent_secondary = "#bb9af7ff"
warning = "#ffcc00ff"
error = "#f7768eff"
backdrop = "#1e1e1eff"
shadow = "#00000088"

[colors.border]
focused = "#7aa2f7ff"
unfocused = "#292e42ff"
outer = "#1e1e1eff"

[colors.overview]
background_tint = "#00000030"
workspace_background = "#00000044"
badge = "#7aa2f7ff"

[appearance]
border_width = 2
outer_border_width = 0
# Square corners: flat Tokyo Night surface, no rounded window edges.
corner_radius = 0
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.2

[appearance.shadow]
enabled = true
softness = 15
offset_x = 0
offset_y = 0

# ==============================================================================
# Animation
# ==============================================================================
# Workspace switch: reveal composites both scenes with the workspace_wipe
# shader instead of sliding the desktop. Without that preset Umbriel reports a
# diagnostic and uses the native slide.
[animation.workspaces]
style = "reveal"
effect = "workspace_wipe"
curve = "snappy"

# ==============================================================================
# Layout — dwindle
# ==============================================================================
[layout]
mode = "dwindle"
gap = 5
extent_presets = [0.333, 0.5, 0.667]

[layout.dwindle]
preserve_split = false

# ==============================================================================
# Window rules
# ==============================================================================
# Noctalia publishes blur regions for its own layer surfaces; this rule enables
# them (bar, notifications, panels, OSD). Layer blur is off by default.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.6
blur_optimized = false

# Noctalia's settings window: floating, predictable size.
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

# ==============================================================================
# Keybinds
# ==============================================================================
# Session, launch and window actions. Mod+0 opens the overview; Mod+O is also
# accepted.
[keybinds]
"Mod+Shift+C" = { action = "config-reload", repeat = false }
"Mod+Shift+E" = { action = "session-quit", repeat = false }

# Terminal: Fedora's default (Ptyxis), RPM or flatpak.
"Mod+Return" = { action = "spawn sh -c 'command -v ptyxis >/dev/null && exec ptyxis || exec flatpak run org.gnome.Ptyxis'", repeat = false }

"Mod+Q" = { action = "window-close", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+T" = { action = "workspace-set-layout toggle", repeat = false }
"Mod+Shift+Space" = { action = "window-toggle-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+Tab" = "window-focus-next"
"Mod+Shift+Tab" = "window-focus-previous"

"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

"Mod+Shift+Left" = "window-move-left"
"Mod+Shift+Right" = "window-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"

"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Minus" = "window-modify-primary-extent -0.02"
"Mod+Equal" = "window-modify-primary-extent +0.02"

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

"Mod+0" = { action = "overview-toggle", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }

# Launcher is Vicinae, not Noctalia's — see install/core/04-desktop-env.sh.
"Mod+Space" = { action = "spawn vicinae toggle", repeat = false }

# Noctalia IPC — control center, settings.
"Mod+S" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Comma" = { action = "spawn noctalia msg settings-toggle", repeat = false }

"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Media keys, from any input device.
"XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", repeat = false }
