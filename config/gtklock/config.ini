# fm-fedora — gtklock configuration
# Generated by install/core/07-gtklock.sh
#
# Paths are absolute because gtklock does not expand ~ in config values.

[main]
gtk-theme=Adwaita
style=@HOME@/.config/gtklock/style.css
layout=@HOME@/.config/gtklock/layout.xml
background=@HOME@/Pictures/wallpapers/nordic-wp-lock.jpg
time-format=%H:%M
date-format=%A, %B %d
idle-hide=1
idle-timeout=15
