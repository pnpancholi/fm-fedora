# fm-fedora — mango configuration
# Generated by install/core/02-mango.sh
# Validate with: mango -c ~/.config/mango/config.conf -p
# Reference: https://mangowm.github.io/docs

# ── Theme (must be sourced before any $theme_* use) ──
source=~/.config/mango/theme.conf

# ── Environment (reset on every config reload) ──
env=QT_QPA_PLATFORM,wayland
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland

# ── Input: keyboard ──
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us
xkb_rules_options=caps:escape

# ── Input: trackpad ──
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# ── Tags ──
# 9 tags (1-9), matching the old sway workspaces 1-9.
# SUPER+0 is reused for the overview; the special overlay holds the old "10th" slot.
tag_num=9

# ── Layout ──
# dwindle = each new window splits the focused one (closest to i3 splith/splitv).
new_is_master=1
default_master_factor=0.55
default_master_count=1
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0
dwindle_drop_simple_split=1
circle_layout=dwindle,tile,monocle,grid,deck

tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# ── Gaps & borders ──
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=2
# Square corners: flat Tokyo Night surface, no rounded window edges.
border_radius=0
no_radius_when_single=0
root_color=${theme_bg}
border_color=${theme_bg}
focus_color=${theme_primary}
urgent_color=${theme_urgent}

# ── Effects (scenefx) ──
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=3
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x00000088

focused_opacity=1.0
unfocused_opacity=1.0

# Dim unfocused windows
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=${theme_dim}

# ── Animations ──
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.85
zoom_end_ratio=1.0
fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.6
tag_animation_direction=1

animation_duration_open=220
animation_duration_close=180
animation_duration_move=400
animation_duration_tag=300
animation_duration_focus=0

animation_curve_open=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_in=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5

# Layer surfaces: launcher zooms in, slurp stays unobstructed
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:vicinae
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=no_animation:1,no_shadow:1,layer_name:swaync

# ── Window rules ──
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,app_id:swayimg

# ── Autostart ──
exec_once=waybar
exec_once=swaync
exec_once=swaybg -i ~/Pictures/wallpapers/nordic-wp.png
exec_once=/usr/libexec/polkit-gnome-authentication-agent-1
exec_once=~/.local/bin/fm-vm-clipboard
exec_once=sh -c 'wl-paste --type text --watch cliphist store'
# wlopm replaces `swaymsg "output * dpms off"`, which does not exist under mango.
exec_once=swayidle -w timeout 300 'swaylock -f' timeout 600 'wlopm --off \*' resume 'wlopm --on \*' before-sleep 'swaylock -f'

# ── Key bindings ──
key_mode=default

# reload / exit
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,e,quit

# launch
bind=SUPER,Return,spawn,ghostty
bind=SUPER,space,spawn,vicinae toggle
bind=SUPER,n,spawn,swaync-client -t -sw

# window actions
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

# focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# move window
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# tags: view
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tags: send window (keeps focus on current tag)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# 0 = overview (replaces the old workspace 10); SHIFT+0 = special overlay
bind=SUPER,0,toggleoverview
bind=SUPER+SHIFT,0,tag_special_tag

# layouts
bind=SUPER,t,switch_layout
bind=SUPER,s,dwindle_split_horizontal
bind=SUPER,w,dwindle_split_vertical
bind=SUPER,e,dwindle_toggle_split_direction

# media keys
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# screenshots
bind=NONE,Print,spawn_shell,mkdir -p ~/Pictures/screenshots && grim ~/Pictures/screenshots/$(date +%s).png
bind=SHIFT,Print,spawn_shell,mkdir -p ~/Pictures/screenshots && grim -g "$(slurp)" ~/Pictures/screenshots/$(date +%s).png

# mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# ── Resize mode (SUPER+R) ──
# Tiled windows in dwindle are resized by dragging their borders
# (enable_border_resize defaults to 1); this mode targets floating windows.
key_mode=resize
bind=NONE,h,smartresizewin,left
bind=NONE,l,smartresizewin,right
bind=NONE,j,smartresizewin,down
bind=NONE,k,smartresizewin,up
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default

key_mode=default
bind=SUPER,r,setkeymode,resize
